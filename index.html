<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specimens — Curated by Yifei</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaeaea;--ink:#161616;--mute:#77776f;--rule:#16161640}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{padding:22px 28px 0}
h1{font-weight:500;font-size:clamp(56px,11vw,180px);letter-spacing:-.055em;line-height:.86;padding:18px 0 14px;}
.sub{display:flex;justify-content:space-between;font-family:"Instrument Serif",serif;font-size:17px;padding:10px 0;}
.plate{position:relative;padding:80px 28px 40px;display:grid;grid-template-columns:repeat(12,1fr);column-gap:28px;row-gap:90px;align-items:start}
.ghost{position:absolute;inset:auto 0 0 0;top:40%;text-align:center;font-family:"Instrument Serif",serif;font-style:italic;font-size:22vw;color:#16161609;pointer-events:none;line-height:1}
.card{position:relative;display:block}
.card img{width:100%;display:block;box-shadow:0 1px 2px #0001,0 12px 30px -14px #0003;transition:transform .4s}
.card:hover img{transform:translateY(-4px)}
.lab{font-family:"Instrument Serif",serif;font-size:14px;margin-bottom:7px;display:flex;gap:10px}
.lab i{color:var(--mute)}
.cap{margin-top:9px;font-size:14px;line-height:1.35}.cap b{font-weight:500;display:block}.cap span{color:var(--mute)}
.index{margin:40px 28px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:48px;grid-auto-rows:1fr;padding:14px 0 60px}
.index a{display:grid;grid-template-columns:62px 1fr auto;align-items:start;align-content:start;font-family:"Instrument Serif",serif;font-size:16px;line-height:1.2;padding:3px 0;border-bottom:1px solid #16161618}
.index a:hover{color:#5a5a52}.index em{color:var(--mute);font-size:14px}
@media(max-width:760px){.plate{grid-template-columns:repeat(6,1fr);row-gap:56px;column-gap:16px;padding:48px 16px}.card{grid-column:span 6!important;margin:0!important}.card.s{grid-column:span 3!important}header{padding:16px}.index{margin:20px 16px}}
header{position:sticky;top:0;z-index:5;padding:14px 28px 0;text-align:center;pointer-events:none}
h1{font-weight:500;font-size:clamp(64px,12.5vw,205px);letter-spacing:-.055em;line-height:.86;padding:0 0 0 .055em;border:0;color:#e0e0e0;text-align:center}
.credit{position:absolute;top:16px;right:28px;font-size:max(14px,calc(clamp(56px,11vw,180px)*.126));color:#d9d9d9;font-weight:400;pointer-events:none}
.tag{font-size:14px}
.card{opacity:0;transform:translateY(28px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}.card.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.card{opacity:1;transform:none;transition:none}}
.plate,.index{position:relative;z-index:6}
.filters{position:absolute;top:16px;left:28px;display:grid;grid-auto-flow:column;justify-items:start;row-gap:2px;column-gap:18px;font-size:max(14px,calc(clamp(56px,11vw,180px)*.126));pointer-events:auto;text-align:left}
.filters button{all:unset;cursor:pointer;color:#d9d9d9;transition:color .25s}
.filters button:hover,.filters button.on{color:#000}
.plate{pointer-events:none}.card{pointer-events:auto}
.card.gone,.index a.gone{display:none}
.card.fade{opacity:0!important;transform:translateY(16px) scale(.98)!important}
.index a{transition:opacity .35s}.index a.fade{opacity:0}
@media(max-width:700px){
header{display:flex;flex-direction:column;align-items:center;padding:12px 0 0}
header h1{order:1;font-size:clamp(56px,17vw,120px)}
.credit{order:2;position:static;font-size:14px;margin-top:6px;text-align:center}
.filters{order:3;position:static;display:flex!important;grid-template-rows:none!important;flex-wrap:nowrap;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%;padding:10px 16px 4px;font-size:14px;white-space:nowrap}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:0 0 auto}
.plate{padding-top:28px}
.cap,.index a,.index em{font-size:16px}
.tag,.lab{font-size:15px}
.credit{font-size:15px}
.filters{font-size:15px;padding:0 16px;gap:18px}
.filters button{min-height:44px;display:flex;align-items:center}
}
.note{position:absolute;z-index:20;top:24px;left:calc(100% - 28px);width:320px;background:#f5f5f5;color:#222;padding:0 24px 0 34px;font:14px/1.35 "DM Mono",monospace;box-shadow:0 2px 4px #0001,0 18px 36px -16px #0004;opacity:0;visibility:hidden;transform:translateY(6px) rotate(var(--r,.6deg));transition:opacity .25s,transform .25s,visibility .25s;pointer-events:none;
background-image:radial-gradient(circle at 12px 50%,#eaeaea 5px,transparent 5.5px);background-size:24px 26px;background-repeat:repeat-y;border-left:1px dashed #d9d9d9}
.card:hover .note,.card.open .note{opacity:1;visibility:visible;transform:rotate(var(--r,.6deg))}
.note .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #222;padding:14px 10px;margin:0 -10px;gap:8px}
.note .hd b{font-weight:400}.note .no{border:1px solid #222;padding:2px 6px;font:14px "DM Mono",monospace;white-space:nowrap}
.note .f{padding:14px 10px 15px;margin:0 -10px;background:linear-gradient(90deg,#222 50%,transparent 50%) left bottom/8px 1px repeat-x}.note .f i{display:block;font-style:normal;font-size:12px;color:#8a8a8a;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;line-height:1}
.note .f span{font:14px/1.35 "DM Mono",monospace}
.note .hand{font:20px/1.15 "Cedarville Cursive",cursive;color:#3a3a3a;opacity:.8;transform:rotate(2deg);transform-origin:left top;padding-left:8px;margin-top:12px;margin-bottom:56px}
.note .cn{position:absolute;right:20px;bottom:14px;line-height:1.3;border:1px solid #d9d9d9;color:#999;font:12px "DM Mono",monospace;padding:0 4px}
.note::before{content:"";position:absolute;top:0;bottom:0;left:24px;right:14px;border-left:1px solid #222;border-right:1px solid #222;pointer-events:none}
.card.flip .note{left:auto;right:calc(100% - 28px)}
.card{z-index:1}.card:hover,.card.open{z-index:50;transition-property:opacity,transform}
@media(max-width:760px){.note{left:8px!important;right:8px!important;top:auto;bottom:8px;width:auto}}
@media (hover:hover){.card>*{transition:opacity .35s ease}body:has(.card:hover) .card:not(:hover)>*{opacity:.4}}.note,.note *{letter-spacing:-.02em!important}.note .hand{letter-spacing:normal!important}.note{background:rgba(245,245,245,.9)!important;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}</style><link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=DM+Mono:wght@400&display=swap" rel="stylesheet"></head><body>
<header><nav class="filters" id="filters"></nav><div class="credit">( Curated by Yifei )</div><h1>Specimens</h1>
</header>
<main class="plate" id="plate"></main>
<section class="index" id="index"></section>
<script>
// layout rhythm: [colStart, span, topOffset px]
const L=[[1,5,0],[7,3,120],[10,3,30],[2,3,40],[5,4,160],[9,4,0],[1,4,90],[6,2,0],[8,5,140],[2,5,0],[8,3,60],[3,3,80],[7,5,0],[1,3,40]];
fetch('data/items.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(items=>{
 const p=document.getElementById('plate'),ix=document.getElementById('index');
 const fmt=d=>new Date(d+'T12:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
 items.slice().reverse().forEach((it,k)=>{const n=items.length-k,f=String(n).padStart(2,'0'),code=String.fromCharCode(65+Math.floor((n-1)/6))+'.'+(((n-1)%6)+1);
  const [c,s,t]=L[k%L.length];const a=document.createElement('a');a.className='card'+(s<=3?' s':'');a.dataset.t=it.type||'';a.href=it.url;a.target='_blank';a.rel='noopener';
  a.style.cssText=`grid-column:${c}/span ${s};margin-top:${t}px`;
  a.innerHTML=`<div class="lab"><span class="tag">${it.type?"/ "+it.type:""}</span></div><img loading="lazy" src="${it.img}" alt="${it.title}"><div class="cap"><b>${it.title}</b><span>${it.creator} — ${fmt(it.date)}</span></div>${it.note?`<div class="note"><div class="hd"><b>${it.title}</b></div><div class="f"><i>Tags</i><span>${it.note.tags.map(t=>"/ "+t).join(" ")}</span></div><div class="f"><i>Hook</i><span>${it.note.hook}</span></div>${it.note.contrast?`<div class="f"><i>Contrast</i><span>${it.note.contrast}</span></div>`:""}<div class="hand">${it.note.handwritten}</div><span class="cn">Fig.${f}</span></div>`:""}`;if(it.note){if(c+s>8)a.classList.add("flip");a.addEventListener("click",e=>{if(matchMedia("(hover:none)").matches&&!a.classList.contains("open")){e.preventDefault();document.querySelectorAll(".card.open").forEach(o=>o.classList.remove("open"));a.classList.add("open");}});}p.appendChild(a);
  const r=document.createElement('a');r.dataset.t=it.type||'';r.href=it.url;r.target='_blank';r.rel='noopener';r.innerHTML=`<span>Fig.${f}</span><span>${it.title}</span><em>${fmt(it.date)}</em>`;ix.appendChild(r);});
 const cards=[...p.querySelectorAll('.card')],rows=[...ix.children],nav=document.getElementById('filters');
 const layout=()=>{let k=0;cards.forEach(c=>{if(c.classList.contains('gone'))return;const [cs,sp,t]=L[k++%L.length];c.style.gridColumn=cs+'/span '+sp;c.style.marginTop=t+'px';c.classList.toggle('s',sp<=3)})};
 const types=['All',...new Set(items.slice().reverse().map(i=>i.type).filter(Boolean))];
 const apply=t=>{[...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));const els=[...cards,...rows];
  els.forEach(e=>e.classList.add('fade'));setTimeout(()=>{els.forEach(e=>e.classList.toggle('gone',t!=='All'&&e.dataset.t!==t));layout();
  void p.offsetHeight;setTimeout(()=>els.forEach(e=>{if(!e.classList.contains('gone')){e.classList.remove('fade');e.classList.add('in')}}),30)},350)};
 types.forEach(t=>{const b=document.createElement('button');b.textContent='/ '+t;b.dataset.t=t;b.onclick=()=>{apply(t);history.replaceState(null,'',t==='All'?location.pathname:'#'+encodeURIComponent(t))};nav.appendChild(b)});nav.style.gridTemplateRows='repeat('+Math.ceil(types.length/2)+',auto)';nav.firstChild.classList.add('on');const h=decodeURIComponent(location.hash.slice(1));if(types.includes(h))apply(h);
 const place=(a,k)=>{const n=a.querySelector('.note');if(!n||matchMedia('(max-width:760px)').matches){if(n){n.style.left=n.style.top=n.style.right='';}return;}
  const c=a.getBoundingClientRect(),W=c.width,H=c.height,nw=n.offsetWidth,nh=n.offsetHeight,vw=innerWidth,vh=innerHeight,m=12,ov=40;
  const h=x=>{x=Math.sin((k+1)*12.9898+x*78.233)*43758.5453;return x-Math.floor(x)};const j=(h(1)-.5)*24,j2=(h(2)-.5)*24;
  const C={r:[W-ov,24+j],l:[ov-nw,24+j],a:[W*.35+j2,ov-nh-8+j*.5],b:[W*.2+j2,H-ov+j*.5],ar:[W-ov,-nh+ov+40+j],al:[ov-nw,-nh+ov+40+j],br:[W-ov,H-ov-40+j],bl:[ov-nw,H-ov-40+j]};
  let ks=['r','l','ar','al','a','br','bl','b'];const s=Math.floor(h(3)*3);ks=ks.slice(s,s+4).concat(ks.slice(0,s),ks.slice(s+4));
  if(c.top+H/2>vh*.6)ks.sort((p,q)=>(q[0]=='a')-(p[0]=='a'));if(c.top+H/2<vh*.3)ks.sort((p,q)=>(q[0]=='b')-(p[0]=='b'));
  let best=null,bs=-1e9;for(const key of ks){let[x,y]=C[key];x=Math.round(x);y=Math.round(y);const L=c.left+x,T=c.top+y;
   const sc=-(Math.max(0,m-L)+Math.max(0,L+nw-(vw-m))+Math.max(0,m-T)+Math.max(0,T+nh-(vh-m)));if(sc===0){best=[x,y];break}if(sc>bs){bs=sc;best=[x,y]}}
  let[x,y]=best;x=Math.min(Math.max(x,m-c.left),vw-m-nw-c.left);y=Math.min(Math.max(y,m-c.top),vh-m-nh-c.top);
  n.style.right='auto';n.style.left=x+'px';n.style.top=y+'px';n.style.setProperty('--r',(-1+h(4)*2.2).toFixed(2)+'deg');};
 document.querySelectorAll('.card').forEach((a,k)=>{a.addEventListener('mouseenter',()=>place(a,k));a.addEventListener('touchstart',()=>place(a,k),{passive:true})});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
 document.querySelectorAll('.card').forEach(c=>io.observe(c));});
</script></body></html>
